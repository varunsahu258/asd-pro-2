[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asd-gen-gap"
version = "0.1.0"
description = "Reproducible ABIDE generalization-gap study scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "pyarrow",
  "pyyaml",
  "pytest",
  "pydantic>=2",
  "nilearn",
  "nibabel",
  "joblib",
  "matplotlib",
]

[project.optional-dependencies]
torch = ["torch", "torch-geometric"]
ants = ["antspyx"]

[tool.pytest.ini_options]
testpaths = ["asd_gen_gap/tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["asd_gen_gap*"]
